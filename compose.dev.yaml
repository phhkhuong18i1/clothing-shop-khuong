services:
  app:
    build:
      target: development
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    volumes:
      - .:/var/www/html
      - ./vendor:/var/www/html/vendor
      - storage_data:/var/www/html/storage
      - bootstrap_cache_data:/var/www/html/bootstrap/cache

  nginx:
    volumes:
      - .:/var/www/html:ro
      - storage_data:/var/www/html/storage:ro

  mysql:
    ports:
      - "127.0.0.1:${MYSQL_FORWARD_PORT:-3307}:3306"

volumes:
  bootstrap_cache_data:
